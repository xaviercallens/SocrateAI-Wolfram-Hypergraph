[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "socrate-ai-wolfram-hypergraph-cag"
version = "0.4.0"
description = "Stream 4: Discrete Hypergraph Cosmology & Computation-Augmented Generation (CAG)"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Xavier Callens", email = "callensxavier@gmail.com" }
]
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "torch>=2.0.0",
    "networkx>=3.0",
    "matplotlib>=3.7.0",
    "astropy>=5.3",
    "wolframclient>=1.3.0",
    "pydantic>=2.0.0",
    "requests>=2.31.0",
    "pytest>=7.4.0",
    "GraphRicciCurvature>=0.5.3",
    "dynesty>=2.1.0",
    "emcee>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "black",
    "flake8",
    "mypy"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
