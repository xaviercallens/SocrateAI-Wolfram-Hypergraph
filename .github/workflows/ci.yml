name: Stream 4 CAG CI/CD & Lean 4 Verification

on:
  push:
    branches: [ main, feature/gcp-alpha-antigravity, experimental/* ]
  pull_request:
    branches: [ main, feature/gcp-alpha-antigravity ]

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .
      - name: Run PyTest Benchmarks
        run: |
          pytest tests/

  lean4-proofs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install Lean 4
        uses: leanprover/lean4-action@v1
      - name: Verify Lean 4 Formal Proofs
        run: |
          lean proofs/Lean4/Hypergraph_Limits.lean
          lean proofs/Lean4/K3_Surfaces.lean
